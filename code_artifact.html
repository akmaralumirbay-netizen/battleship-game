<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Морской бой | Narxoz Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            max-width: 900px;
            width: 100%;
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2.2rem;
            color: #38ef7d;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .controls-bar, .difficulty-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .difficulty-select {
            background: #334155;
            color: #fff;
            border: 1px solid #475569;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: #0f172a;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 239, 125, 0.4);
        }

        .btn-secondary {
            background: #334155;
            color: #f8fafc;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .status-box {
            background: #0f172a;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 24px;
            border: 1px solid #334155;
        }

        #gameMessage {
            font-weight: 500;
            font-size: 1.05rem;
        }

        .timer-display {
            font-size: 1.1rem;
            font-weight: bold;
            color: #38ef7d;
            margin-top: 6px;
            transition: color 0.3s ease;
        }

        .timer-display.urgent {
            color: #ff4757;
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .score-board {
            margin-top: 6px;
            font-size: 0.95rem;
            color: #cbd5e1;
        }

        .game-boards {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            flex-wrap: wrap;
        }

        .board-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .board-wrapper h3 {
            font-size: 1.1rem;
            color: #38ef7d;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(10, 32px);
            grid-template-rows: repeat(10, 32px);
            gap: 4px;
            background: #0f172a;
            padding: 6px;
            border-radius: 8px;
            border: 2px solid #334155;
        }

        .cell {
            width: 32px;
            height: 32px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .cell:hover {
            background: #334155;
            transform: scale(1.05);
        }

        .cell.ship {
            background: #3b82f6;
        }

        .cell.hit {
            background: #f97316;
            cursor: not-allowed;
        }

        .cell.miss {
            background: #475569;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .cell.sunk {
            background: #ef4444;
            cursor: not-allowed;
        }

        @media (max-width: 700px) {
            .board {
                grid-template-columns: repeat(10, 26px);
                grid-template-rows: repeat(10, 26px);
                gap: 3px;
            }
            .cell {
                width: 26px;
                height: 26px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>⚓ BATTLESHIP</h1>
            <p class="subtitle">Narxoz Incubator 2026 Edition</p>
        </header>

        <main>
            <div class="difficulty-wrapper">
                <label for="difficultySelect">🤖 Режим AI: </label>
                <select id="difficultySelect" class="difficulty-select">
                    <option value="easy">🐣 Лёгкий (Случайная стрельба)</option>
                    <option value="hard" selected>🔥 Сложный (Умный дострел)</option>
                </select>
            </div>

            <div class="controls-bar">
                <button id="autoPlaceBtn" class="btn btn-secondary">🎲 Авторасстановка</button>
                <button id="resetBoardBtn" class="btn btn-secondary">🔄 Сбросить</button>
                <button id="startBtn" class="btn btn-primary">🚀 Начать игру</button>
            </div>

            <div class="status-box">
                <p id="gameMessage">Расставьте корабли и нажмите «Начать игру»</p>
                <div id="timerDisplay" class="timer-display">⏳ Время на ход: <span id="timeLeft">10</span> с</div>
                <div id="scoreBoard" class="score-board">🏆 Вы: 0 | 🤖 Компьютер: 0</div>
            </div>

            <section class="game-boards">
                <div class="board-wrapper">
                    <h3>Ваш флот</h3>
                    <div id="playerBoard" class="board"></div>
                </div>

                <div class="board-wrapper">
                    <h3>Флот противника</h3>
                    <div id="computerBoard" class="board"></div>
                </div>
            </section>
        </main>
    </div>

    <script>
        (function () {
            const SIZE = 10;
            const FLEET_SIZES = [4, 3, 3, 2, 2, 2, 1, 1, 1, 1];
            const TURN_TIME_LIMIT = 10;
            const STORAGE_KEY = "narxoz_battleship_state_v8";
            const SCORE_KEY = "narxoz_battleship_score_v8";

            const playerBoardEl = document.getElementById("playerBoard");
            const computerBoardEl = document.getElementById("computerBoard");
            const startBtn = document.getElementById("startBtn");
            const autoPlaceBtn = document.getElementById("autoPlaceBtn");
            const resetBoardBtn = document.getElementById("resetBoardBtn");
            const gameMessageEl = document.getElementById("gameMessage");
            const scoreBoardEl = document.getElementById("scoreBoard");
            const difficultySelectEl = document.getElementById("difficultySelect");
            const timerDisplayEl = document.getElementById("timerDisplay");
            const timeLeftEl = document.getElementById("timeLeft");

            let playerShips = [];
            let computerShips = [];
            let playerShots = [];
            let computerShots = [];
            let playerTurn = true;
            let gameStarted = false;
            let aiTargetQueue = [];
            let aiDifficulty = "hard";

            let score = { player: 0, computer: 0 };
            let timerInterval = null;
            let timeLeft = TURN_TIME_LIMIT;

            // ЗВУКОВОЙ ДВИЖОК
            const SoundEngine = {
                ctx: null,
                init() {
                    if (!this.ctx) {
                        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                        if (AudioContextClass) this.ctx = new AudioContextClass();
                    }
                    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
                },
                playMiss() {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(500, now);
                    osc.frequency.exponentialRampToValueAtTime(150, now + 0.2);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.2);
                },
                playHit() {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.3);
                },
                playSunk() {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    [0, 0.12].forEach(delay => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = "square";
                        osc.frequency.setValueAtTime(110, now + delay);
                        osc.frequency.exponentialRampToValueAtTime(25, now + delay + 0.4);
                        gain.gain.setValueAtTime(0.3, now + delay);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.4);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + delay);
                        osc.stop(now + delay + 0.4);
                    });
                },
                playWin() {
                    this.init();
                    if (!this.ctx) return;
                    const notes = [261.63, 329.63, 392.00, 523.25];
                    const now = this.ctx.currentTime;
                    notes.forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = "triangle";
                        osc.frequency.setValueAtTime(freq, now + idx * 0.12);
                        gain.gain.setValueAtTime(0.2, now + idx * 0.12);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.3);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + idx * 0.12);
                        osc.stop(now + idx * 0.12 + 0.3);
                    });
                },
                playLose() {
                    this.init();
                    if (!this.ctx) return;
                    const notes = [220.00, 207.65, 196.00, 185.00];
                    const now = this.ctx.currentTime;
                    notes.forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = "sawtooth";
                        osc.frequency.setValueAtTime(freq, now + idx * 0.2);
                        gain.gain.setValueAtTime(0.15, now + idx * 0.2);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.2 + 0.35);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + idx * 0.2);
                        osc.stop(now + idx * 0.2 + 0.35);
                    });
                }
            };

            function safeStorageGet(key) {
                try { return localStorage.getItem(key); } catch (e) { return null; }
            }
            function safeStorageSet(key, value) {
                try { localStorage.setItem(key, value); } catch (e) {}
            }
            function safeStorageRemove(key) {
                try { localStorage.removeItem(key); } catch (e) {}
            }

            function loadScore() {
                const saved = safeStorageGet(SCORE_KEY);
                if (saved) {
                    try { score = JSON.parse(saved); } catch (e) {}
                }
                updateScoreDisplay();
            }

            function saveScore() {
                safeStorageSet(SCORE_KEY, JSON.stringify(score));
                updateScoreDisplay();
            }

            function updateScoreDisplay() {
                if (scoreBoardEl) {
                    scoreBoardEl.textContent = `🏆 Вы: ${score.player} | 🤖 Компьютер: ${score.computer}`;
                }
            }

            function startTurnTimer() {
                stopTurnTimer();
                if (!gameStarted || !playerTurn) return;

                timeLeft = TURN_TIME_LIMIT;
                updateTimerDisplay();

                timerInterval = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay();

                    if (timeLeft <= 0) {
                        stopTurnTimer();
                        setMessage("⌛ Время вышло! Вы пропустили ход.");
                        SoundEngine.playMiss();
                        playerTurn = false;
                        setTimeout(computerTurn, 800);
                    }
                }, 1000);
            }

            function stopTurnTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            }

            function updateTimerDisplay() {
                if (timeLeftEl) timeLeftEl.textContent = timeLeft;
                if (timerDisplayEl) {
                    if (timeLeft <= 3) {
                        timerDisplayEl.classList.add("urgent");
                    } else {
                        timerDisplayEl.classList.remove("urgent");
                    }
                }
            }

            function init() {
                renderEmptyBoards();
                loadScore();

                if (difficultySelectEl) {
                    aiDifficulty = difficultySelectEl.value;
                    difficultySelectEl.addEventListener("change", (e) => {
                        aiDifficulty = e.target.value;
                    });
                }

                if (!loadGameState() || playerShips.length === 0) {
                    autoPlacePlayerShips();
                }

                if (startBtn) startBtn.addEventListener("click", () => { SoundEngine.init(); onStartGame(); });
                if (autoPlaceBtn) {
                    autoPlaceBtn.addEventListener("click", () => {
                        SoundEngine.init();
                        if (gameStarted) return;
                        autoPlacePlayerShips();
                    });
                }
                if (resetBoardBtn) resetBoardBtn.addEventListener("click", () => { SoundEngine.init(); resetGame(); });
            }

            function renderEmptyBoards() {
                if (playerBoardEl) createBoard(playerBoardEl, false);
                if (computerBoardEl) createBoard(computerBoardEl, true);
            }

            function createBoard(boardEl, isComputer) {
                boardEl.innerHTML = "";
                for (let r = 0; r < SIZE; r++) {
                    for (let c = 0; c < SIZE; c++) {
                        const cell = document.createElement("button");
                        cell.classList.add("cell");
                        cell.dataset.row = r;
                        cell.dataset.col = c;

                        if (isComputer) {
                            cell.addEventListener("click", () => handlePlayerShot(r, c));
                        }
                        boardEl.appendChild(cell);
                    }
                }
            }

            function canPlaceShip(ships, row, col, size, horizontal) {
                for (let i = 0; i < size; i++) {
                    const r = horizontal ? row : row + i;
                    const c = horizontal ? col + i : col;

                    if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return false;

                    for (const ship of ships) {
                        for (const pos of ship) {
                            if (Math.abs(pos.row - r) <= 1 && Math.abs(pos.col - c) <= 1) {
                                return false;
                            }
                        }
                    }
                }
                return true;
            }

            function placeSingleShip(ships, size) {
                let placed = false;
                let attempts = 0;
                while (!placed && attempts < 500) {
                    attempts++;
                    const horizontal = Math.random() < 0.5;
                    const row = Math.floor(Math.random() * SIZE);
                    const col = Math.floor(Math.random() * SIZE);

                    if (canPlaceShip(ships, row, col, size, horizontal)) {
                        const ship = [];
                        for (let i = 0; i < size; i++) {
                            ship.push({
                                row: horizontal ? row : row + i,
                                col: horizontal ? col + i : col,
                                hit: false
                            });
                        }
                        ships.push(ship);
                        placed = true;
                    }
                }
            }

            function generateRandomFleet() {
                const ships = [];
                FLEET_SIZES.forEach(size => placeSingleShip(ships, size));
                return ships;
            }

            function autoPlacePlayerShips() {
                playerShips = generateRandomFleet();
                renderPlayerFleet();
                setMessage("Флот расставлен! Нажмите «Начать игру».");
            }

            function renderPlayerFleet() {
                createBoard(playerBoardEl, false);
                playerShips.forEach(ship => {
                    ship.forEach(pos => {
                        const cell = playerBoardEl.querySelector(`[data-row="${pos.row}"][data-col="${pos.col}"]`);
                        if (cell) cell.classList.add("ship");
                    });
                });
            }

            function onStartGame() {
                if (playerShips.length === 0) {
                    autoPlacePlayerShips();
                }

                computerShips = generateRandomFleet();
                playerShots = [];
                computerShots = [];
                aiTargetQueue = [];
                gameStarted = true;
                playerTurn = true;

                renderEmptyBoards();
                renderPlayerFleet();

                if (autoPlaceBtn) autoPlaceBtn.style.display = "none";
                if (resetBoardBtn) resetBoardBtn.style.display = "inline-block";
                if (startBtn) startBtn.textContent = "Перезапустить игру";

                setMessage("Игра началась! Ваш ход — стреляйте по полю противника.");
                startTurnTimer();
                saveGameState();
            }

            function handlePlayerShot(row, col) {
                if (!gameStarted || !playerTurn) return;

                if (isAlreadyShot(playerShots, row, col)) {
                    setMessage("Вы уже стреляли в эту клетку!");
                    return;
                }

                stopTurnTimer();

                playerShots.push({ row, col });
                const cell = computerBoardEl.querySelector(`[data-row="${row}"][data-col="${col}"]`);
                const hitResult = checkHit(computerShips, row, col);

                if (hitResult) {
                    hitResult.pos.hit = true;
                    if (cell) cell.classList.add("hit");

                    if (isShipSunk(hitResult.ship)) {
                        markSunkShip(computerBoardEl, hitResult.ship, playerShots);
                        setMessage("💥 Корабль противника потоплен!");
                        SoundEngine.playSunk();
                    } else {
                        setMessage("🎯 Попадание! Ходите ещё раз.");
                        SoundEngine.playHit();
                    }

                    if (checkFleetSunk(computerShips)) {
                        finishGame(true);
                        return;
                    }

                    startTurnTimer();
                } else {
                    if (cell) cell.classList.add("miss");
                    setMessage("💧 Промах! Ход компьютера...");
                    SoundEngine.playMiss();
                    playerTurn = false;
                    setTimeout(computerTurn, 800);
                }

                saveGameState();
            }

            function computerTurn() {
                if (!gameStarted) return;

                stopTurnTimer();

                let target = getAITarget();
                computerShots.push(target);

                const cell = playerBoardEl.querySelector(`[data-row="${target.row}"][data-col="${target.col}"]`);
                const hitResult = checkHit(playerShips, target.row, target.col);

                if (hitResult) {
                    hitResult.pos.hit = true;
                    if (cell) cell.classList.add("hit");

                    if (isShipSunk(hitResult.ship)) {
                        markSunkShip(playerBoardEl, hitResult.ship, computerShots);
                        aiTargetQueue = [];
                        setMessage("🤖 Компьютер потопил ваш корабль!");
                        SoundEngine.playSunk();
                    } else {
                        if (aiDifficulty === "hard") {
                            addNeighborsToAIQueue(target.row, target.col);
                        }
                        setMessage("🤖 Компьютер попал и ходит снова!");
                        SoundEngine.playHit();
                    }

                    if (checkFleetSunk(playerShips)) {
                        finishGame(false);
                        return;
                    }

                    saveGameState();
                    setTimeout(computerTurn, 800);
                } else {
                    if (cell) cell.classList.add("miss");
                    setMessage("🤖 Компьютер промахнулся. Ваш ход!");
                    SoundEngine.playMiss();
                    playerTurn = true;
                    startTurnTimer();
                    saveGameState();
                }
            }

            function getAITarget() {
                if (aiDifficulty === "hard") {
                    while (aiTargetQueue.length > 0) {
                        const candidate = aiTargetQueue.shift();
                        if (!isAlreadyShot(computerShots, candidate.row, candidate.col)) {
                            return candidate;
                        }
                    }
                }

                let r, c;
                do {
                    r = Math.floor(Math.random() * SIZE);
                    c = Math.floor(Math.random() * SIZE);
                } while (isAlreadyShot(computerShots, r, c));

                return { row: r, col: c };
            }

            function addNeighborsToAIQueue(r, c) {
                const dirs = [
                    { row: r - 1, col: c },
                    { row: r + 1, col: c },
                    { row: r, col: c - 1 },
                    { row: r, col: c + 1 }
                ];

                dirs.forEach(d => {
                    if (d.row >= 0 && d.row < SIZE && d.col >= 0 && d.col < SIZE) {
                        if (!isAlreadyShot(computerShots, d.row, d.col)) {
                            aiTargetQueue.push(d);
                        }
                    }
                });
            }

            function checkHit(ships, r, c) {
                for (const ship of ships) {
                    for (const pos of ship) {
                        if (pos.row === r && pos.col === c) {
                            return { ship, pos };
                        }
                    }
                }
                return null;
            }

            function isShipSunk(ship) {
                return ship.every(p => p.hit);
            }

            function checkFleetSunk(ships) {
                return ships.every(isShipSunk);
            }

            function markSunkShip(boardEl, ship, shotsArr) {
                ship.forEach(pos => {
                    const cell = boardEl.querySelector(`[data-row="${pos.row}"][data-col="${pos.col}"]`);
                    if (cell) {
                        cell.classList.remove("hit");
                        cell.classList.add("sunk");
                    }

                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            const nr = pos.row + dr;
                            const nc = pos.col + dc;
                            if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) {
                                if (!isAlreadyShot(shotsArr, nr, nc)) {
                                    shotsArr.push({ row: nr, col: nc });
                                    const surroundCell = boardEl.querySelector(`[data-row="${nr}"][data-col="${nc}"]`);
                                    if (surroundCell) surroundCell.classList.add("miss");
                                }
                            }
                        }
                    }
                });
            }

            function isAlreadyShot(shots, r, c) {
                return shots.some(s => s.row === r && s.col === c);
            }

            function setMessage(msg) {
                if (gameMessageEl) gameMessageEl.textContent = msg;
            }

            function finishGame(playerWon) {
                gameStarted = false;
                stopTurnTimer();
                safeStorageRemove(STORAGE_KEY);
                if (autoPlaceBtn) autoPlaceBtn.style.display = "inline-block";

                if (playerWon) {
                    score.player++;
                    setMessage("🏆 ПОБЕДА! Вы уничтожили весь флот противника!");
                    SoundEngine.playWin();
                } else {
                    score.computer++;
                    setMessage("⚓ ПОРАЖЕНИЕ! Компьютер разгромил ваш флот.");
                    SoundEngine.playLose();
                }

                saveScore();
            }

            function resetGame() {
                gameStarted = false;
                stopTurnTimer();
                safeStorageRemove(STORAGE_KEY);
                if (autoPlaceBtn) autoPlaceBtn.style.display = "inline-block";
                if (startBtn) startBtn.textContent = "🚀 Начать игру";
                autoPlacePlayerShips();
            }

            function saveGameState() {
                if (!gameStarted) return;
                const state = {
                    playerShips,
                    computerShips,
                    playerShots,
                    computerShots,
                    playerTurn,
                    gameStarted,
                    aiTargetQueue,
                    aiDifficulty
                };
                safeStorageSet(STORAGE_KEY, JSON.stringify(state));
            }

            function loadGameState() {
                const saved = safeStorageGet(STORAGE_KEY);
                if (!saved) return false;

                try {
                    const state = JSON.parse(saved);
                    if (!state.playerShips || state.playerShips.length === 0) return false;

                    playerShips = state.playerShips;
                    computerShips = state.computerShips;
                    playerShots = state.playerShots;
                    computerShots = state.computerShots;
                    playerTurn = state.playerTurn;
                    gameStarted = state.gameStarted;
                    aiTargetQueue = state.aiTargetQueue || [];
                    if (state.aiDifficulty) {
                        aiDifficulty = state.aiDifficulty;
                        if (difficultySelectEl) difficultySelectEl.value = aiDifficulty;
                    }

                    if (gameStarted) {
                        renderEmptyBoards();
                        renderPlayerFleet();

                        playerShots.forEach(s => {
                            const cell = computerBoardEl.querySelector(`[data-row="${s.row}"][data-col="${s.col}"]`);
                            const hit = checkHit(computerShips, s.row, s.col);
                            if (cell) cell.classList.add(hit ? "hit" : "miss");
                        });

                        computerShots.forEach(s => {
                            const cell = playerBoardEl.querySelector(`[data-row="${s.row}"][data-col="${s.col}"]`);
                            const hit = checkHit(playerShips, s.row, s.col);
                            if (cell) cell.classList.add(hit ? "hit" : "miss");
                        });

                        computerShips.forEach(s => { if (isShipSunk(s)) markSunkShip(computerBoardEl, s, playerShots); });
                        playerShips.forEach(s => { if (isShipSunk(s)) markSunkShip(playerBoardEl, s, computerShots); });

                        if (autoPlaceBtn) autoPlaceBtn.style.display = "none";
                        if (startBtn) startBtn.textContent = "Перезапустить игру";
                        setMessage(playerTurn ? "Игра восстановлена. Ваш ход!" : "Игра восстановлена. Ход компьютера...");

                        if (playerTurn) {
                            startTurnTimer();
                        } else {
                            setTimeout(computerTurn, 1000);
                        }
                        return true;
                    }
                } catch (e) {
                    console.error("Ошибка загрузки сохранённой игры", e);
                }
                return false;
            }

            init();
        })();
    </script>
</body>
</html>
